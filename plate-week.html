<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F242B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plate Week">
<title>Plate Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E7EA;--card:#F5F6F7;--ink:#15191F;--mute:#5B6573;--line:#C8CDD3;--rubber:#1F242B;
  --good:#2C8A4B;--blue:#1D5FC0;--nav:64px;
  --accent:#D63A2F;--accent-ink:#fff;--ring:rgba(255,255,255,.2);
  --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(var(--nav) + 28px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
@supports (background:color-mix(in srgb,red 10%,white)){
  body{--bg:color-mix(in srgb,var(--accent) 9%,#E4E7EA)}
  .hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#000))}
}

/* hero header */
.hero{position:relative;overflow:hidden;margin:calc(-20px - env(safe-area-inset-top)) -16px 6px;padding:calc(28px + env(safe-area-inset-top)) 18px 26px;
  background:var(--accent);color:var(--accent-ink);border-radius:0 0 24px 24px}
.hero::after{content:"";position:absolute;right:-56px;top:-56px;width:210px;height:210px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,transparent 0 19%,var(--ring) 19% 22%,transparent 22% 38%,var(--ring) 38% 41%,transparent 41% 64%,var(--ring) 64% 100%)}
.hero>*{position:relative;z-index:1}
.hero .title,.hero .sub{color:inherit}
.hero .sub{opacity:.88;margin-top:6px}
.hero .icon{color:var(--accent-ink)}
.hero .icon:active{background:rgba(255,255,255,.2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--mc);flex:none}
.card.mc{border-left:6px solid var(--mc)}
.card.mc .tag{border-color:var(--mc);color:var(--ink);background:#fff}
button{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 24px}

.title{font:700 36px/1 var(--cond);margin:0}
.h2{font:700 24px/1.1 var(--cond);margin:0}
.h3{font:700 20px/1.15 var(--cond);margin:0}
.num{font-family:var(--cond)}
.sub{color:var(--mute);font-size:15px;margin:6px 0 0}
.fine{color:var(--mute);font-size:13px;margin:8px 0 0}
.lbl{font-size:14px;font-weight:600;margin:16px 0 8px;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.left{text-align:left}
.ic{flex:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px}

/* plates */
.plate{position:relative;display:inline-block;flex:none;width:var(--sz);height:var(--sz);border-radius:50%;background:var(--pc);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 1px 1px rgba(0,0,0,.25)}
.plate.white{box-shadow:inset 0 0 0 2px #8B939E,0 1px 1px rgba(0,0,0,.2)}
.plate::before{content:"";position:absolute;inset:calc(var(--sz)*.16);border-radius:50%;border:2px solid rgba(0,0,0,.18)}
.plate.full::before{border-color:rgba(255,255,255,.22)}
.plate::after{content:"";position:absolute;inset:calc(var(--sz)*.36);border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.4)}
.week .plate::after{background:var(--bg)}
.plate .tick{position:absolute;inset:0;display:grid;place-items:center;z-index:1;color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:22px;align-items:end}
.dcol{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer}
div.dcol{cursor:default}
.dlabel{font-size:13px;font-weight:500;color:var(--mute)}
.dlabel.today{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;color:var(--ink);font-weight:600}
.rest{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);margin:17px 0}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:8px;padding:14px;margin-top:12px;
  font:700 20px var(--cond);letter-spacing:.3px;cursor:pointer;background:transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{background:#9AA1AB;cursor:not-allowed}
.btn.ghost{border:1.5px solid var(--rubber)}
.btn.small{font-size:17px;padding:10px;margin-top:10px}
.btn.text{color:var(--mute);font:600 15px "Barlow",system-ui,sans-serif;margin-top:6px}
.btn.danger{color:#B3261E}
.icon{display:grid;place-items:center;width:40px;height:40px;border:0;background:none;border-radius:8px;color:var(--mute);cursor:pointer;flex:none}
.icon:active{background:rgba(0,0,0,.08)}
.chip{border:1.5px solid var(--rubber);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;margin:0 6px 8px 0}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;border:1.5px solid var(--rubber);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:11px 4px;background:transparent;border:0;font-weight:600;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--rubber)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.txt{width:100%;height:46px;border:1.5px solid var(--line);border-radius:8px;background:#fff;padding:0 12px;font:500 17px "Barlow",system-ui,sans-serif;color:var(--ink)}

/* workout */
.ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.exname{font-weight:600;font-size:17px;display:block}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-right:6px}
.namebtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:700 22px/1.15 var(--cond);display:flex;gap:6px;align-items:center}
.cue{background:#E9ECEF;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:15px}
.sethead,.setrow{display:grid;grid-template-columns:28px 1fr 1fr 44px 48px;gap:8px;align-items:center}
.sethead{margin-top:14px;font-size:13px;color:var(--mute);text-align:center;font-weight:500}
.setrow{margin-top:8px}
.setn{font:600 20px var(--cond);color:var(--mute);text-align:center}
.setrow.warm .setn{color:var(--blue)}
.in{width:100%;min-width:0;height:48px;border:1.5px solid var(--line);border-radius:8px;background:#fff;text-align:center;font:600 21px var(--cond);color:var(--ink)}
.setrow.warm .in{border-style:dashed}
.setrow.done .in{background:#DDEBE1;border-color:#9CC4A8}
.rir{height:48px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font:600 19px var(--cond);color:var(--mute);cursor:pointer}
.chk{height:48px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:#B5BBC3;display:grid;place-items:center;cursor:pointer}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}

/* recovery */
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.fig{text-align:center;color:var(--mute);font-size:14px}
.fig svg{width:100%;max-width:190px;height:auto;display:block;margin:0 auto 4px}
.mus{cursor:pointer;stroke:rgba(0,0,0,.3);stroke-width:1}
.body-base{fill:#B9BFC7}
.legend{height:10px;border-radius:5px;background:linear-gradient(90deg,hsl(0 70% 45%),hsl(60 70% 45%),hsl(120 70% 45%));margin-top:14px}
.legend+div{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:4px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.mrow:first-child{border-top:0}
.mname{width:114px;font-weight:600;display:flex;align-items:center}
.bar{position:relative;height:10px;border-radius:5px;background:#D5D9DE;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar>b{position:absolute;top:0;bottom:0;background:rgba(21,25,31,.14)}
.pct{width:46px;text-align:right;font:600 20px var(--cond)}

/* progress */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:700 30px/1 var(--cond)}
.stat span{font-size:14px;color:var(--mute)}
.chart{width:100%;height:auto;display:block;margin-top:10px}
select.txt{appearance:auto}
.hist{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:14px 16px;cursor:pointer;text-align:left}

/* chrome */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--rubber);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.navin button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav);background:none;border:0;border-top:3px solid transparent;color:#A9B1BD;font-size:13px;font-weight:600;cursor:pointer}
.navin button[aria-current="page"]{color:#fff;border-top-color:var(--tc,#fff)}
.navin button[aria-current="page"] svg{color:var(--tc,#fff)}
.timerbar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:19;display:none}
.timerbar.on{display:block}
.tbin{max-width:520px;margin:0 auto;background:#fff;border:1.5px solid var(--rubber);border-radius:12px 12px 0 0;padding:8px 12px;display:flex;align-items:center;gap:8px}
.tbin .time{font:700 30px/1 var(--cond);min-width:76px}
.tbin .bar{flex:1}
.tbin button{border:1.5px solid var(--rubber);background:none;border-radius:8px;height:38px;padding:0 10px;font-weight:600;cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:86vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .18s ease-out;border-top:6px solid var(--accent)}
.sheet .in-wrap{max-width:520px;margin:0 auto}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:13px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.pick:first-of-type{border-top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 76px + env(safe-area-inset-bottom));background:var(--rubber);color:#fff;
  padding:10px 16px;border-radius:999px;font-size:15px;z-index:60;max-width:90vw;text-align:center}
.sw{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;font-weight:600}
.sw i{width:44px;height:26px;border-radius:13px;background:#B5BBC3;position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-pressed="true"] i{background:var(--accent)}
.sw[aria-pressed="true"] i{box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw[aria-pressed="true"] i::after{transform:translateX(18px)}
input[type=range]{width:100%;margin:14px 0}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.sw i,.sw i::after{transition:none}}
@media (max-width:360px){.plate{--sz:38px!important}.sethead,.setrow{grid-template-columns:22px 1fr 1fr 40px 44px;gap:6px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="timerbar" class="timerbar" role="timer"></div>
<nav id="nav" class="nav" aria-label="Main"></nav>
<div id="sheet"></div>
<div id="toast" class="toast" role="status" style="display:none"></div>
<script>
'use strict';
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const DAY_MS = 864e5;
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

const ICON = {
  check: '<path d="M20 6 9 17l-5-5"/>',

  sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',

const ic = (k, size = 20) => `<svg class="ic" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

/* ================= data ================= */
const MUSCLES = ['chest', 'back', 'shoulders', 'biceps', 'triceps', 'abs', 'quads', 'hamstrings', 'glutes', 'calves'];

const EQUIP = [['barbell', 'Barbell and rack'], ['dumbbell', 'Dumbbells'], ['bench', 'Bench'], ['cable', 'Cable machine'], ['machine', 'Weight machines'], ['pullup', 'Pull-up and dip station']];
const PLATE = { push: '#D63A2F', pull: '#1D5FC0', legs: '#EDB60C', upper: '#2C8A4B', full: '#2B3038' };
const MCOLOR = { chest: '#D63A2F', back: '#1D5FC0', shoulders: '#E8742A', biceps: '#1A9E8F', triceps: '#7B4BC4', abs: '#E0A800', quads: '#2C8A4B', hamstrings: '#B03A7A', glutes: '#E05A8C', calves: '#2A9BD6' };

const KIND_LABEL = { push: 'Push', pull: 'Pull', legs: 'Legs', upper: 'Upper body', full: 'Full body' };
const DUR_N = { 30: 4, 45: 5, 60: 6, 75: 7, 90: 8 };
const GOALS = { muscle: 'Build muscle', strength: 'Get stronger', fitness: 'General fitness' };
const EXPS = { beginner: 0.6, intermediate: 1, advanced: 1.35 };
const SPLITS = { recovery: 'Recovery-first', ppl: 'Push, pull, legs', ul: 'Upper and lower', full: 'Full body' };
const WAVES = {
  muscle: { c: [8, 6, 10], i: [12, 10, 15] },
  strength: { c: [5, 3, 6], i: [8, 10, 8] },
  fitness: { c: [10, 12, 8], i: [12, 15, 12] },
};
const PACES = { gentle: [0.0025, 'Gentle'], steady: [0.005, 'Steady'], faster: [0.0075, 'Faster'] };
const CARDIO = { walk: 'incline walk', bike: 'bike ride', row: 'rower', stairs: 'stair climber' };
const ACTIVITY = [[1.375, 'Light'], [1.55, 'Moderate'], [1.725, 'Very active']];
const REST = { muscle: { c: 120, i: 75 }, strength: { c: 180, i: 90 }, fitness: { c: 60, i: 45 } };

// id, name, primary, secondary, equipment needed, compound, load type, 1RM as a multiple of body weight, movement pattern, cue
const RAW = [
  ['bench', 'Barbell Bench Press', 'chest', ['shoulders', 'triceps'], ['barbell', 'bench'], 1, 'bar', 1.0, 'hpress', 'Pinch your shoulder blades, lower to mid-chest, press up and slightly back.'],
  ['incbar', 'Incline Barbell Press', 'chest', ['shoulders', 'triceps'], ['barbell', 'bench'], 1, 'bar', 0.8, 'hpress', 'Bench at about 30 degrees. Bar touches the upper chest, elbows tucked.'],
  ['dbbench', 'Dumbbell Bench Press', 'chest', ['shoulders', 'triceps'], ['dumbbell', 'bench'], 1, 'db', 0.38, 'hpress', 'Lower until elbows pass the bench, press the weights together over your chest.'],

  ['machchest', 'Machine Chest Press', 'chest', ['triceps', 'shoulders'], ['machine'], 1, 'mach', 0.9, 'hpress', 'Handles at mid-chest height, back flat on the pad.'],

  ['pushup', 'Push-Up', 'chest', ['triceps', 'shoulders'], [], 1, 'bw', 0, 'hpress', 'Body in a straight line, chest to the floor, elbows about 45 degrees.'],
  ['pullup', 'Pull-Up', 'back', ['biceps'], ['pullup'], 1, 'bw', 0, 'vpull', 'Start from a dead hang and pull your chest toward the bar.'],
  ['latpd', 'Lat Pulldown', 'back', ['biceps'], ['cable'], 1, 'cable', 0.8, 'vpull', 'Lean back slightly, pull the bar to your upper chest, elbows down.'],
  ['barrow', 'Barbell Row', 'back', ['biceps'], ['barbell'], 1, 'bar', 0.8, 'hrow', 'Hinge to about 45 degrees and pull the bar to your lower ribs.'],
  ['seatrow', 'Seated Cable Row', 'back', ['biceps'], ['cable'], 1, 'cable', 0.8, 'hrow', 'Sit tall, pull the handle to your stomach, squeeze your shoulder blades.'],
  ['chestrow', 'Chest-Supported Row', 'back', ['biceps'], ['machine'], 1, 'mach', 0.7, 'hrow', 'Chest on the pad, drive your elbows back, pause at the squeeze.'],
  ['dbrow', 'One-Arm Dumbbell Row', 'back', ['biceps'], ['dumbbell'], 1, 'db', 0.35, 'hrow', 'Brace on a bench or rack and pull the dumbbell toward your hip.'],
  ['deadlift', 'Deadlift', 'back', ['hamstrings', 'glutes'], ['barbell'], 1, 'bar', 1.5, 'hinge', 'Bar over mid-foot, brace hard, push the floor away and lock out your hips.'],
  ['facepull', 'Face Pull', 'shoulders', ['back'], ['cable'], 0, 'cable', 0.3, 'rear', 'Rope at eye level, pull toward your face with elbows high and wide.'],
  ['ohp', 'Overhead Press', 'shoulders', ['triceps'], ['barbell'], 1, 'bar', 0.6, 'vpress', 'Squeeze your glutes, press the bar straight up, head through at the top.'],
  ['dbpress', 'Seated Dumbbell Press', 'shoulders', ['triceps'], ['dumbbell', 'bench'], 1, 'db', 0.27, 'vpress', 'Back supported, press until your arms are straight, lower to ear level.'],
  ['machpress', 'Machine Shoulder Press', 'shoulders', ['triceps'], ['machine'], 1, 'mach', 0.6, 'vpress', 'Handles start at shoulder level. Press without shrugging.'],
  ['latraise', 'Dumbbell Lateral Raise', 'shoulders', [], ['dumbbell'], 0, 'db', 0.12, 'lat', 'Lead with your elbows, raise to shoulder height, lower slowly.'],
  ['cablelat', 'Cable Lateral Raise', 'shoulders', [], ['cable'], 0, 'cable', 0.12, 'lat', 'Stand side-on to the stack and raise the handle out to the side.'],
  ['reardelt', 'Reverse Pec Deck', 'shoulders', ['back'], ['machine'], 0, 'mach', 0.35, 'rear', 'Chest on the pad, sweep the handles out and back.'],
  ['bbcurl', 'Barbell Curl', 'biceps', [], ['barbell'], 0, 'bar', 0.5, 'curl', 'Elbows pinned to your sides, curl up, lower for a full stretch.'],
  ['dbcurl', 'Dumbbell Curl', 'biceps', [], ['dumbbell'], 0, 'db', 0.2, 'curl', 'Rotate your palms up as you curl. No swinging.'],

const Store = (() => {

  if (state.active) state.active.entries.forEach(fix);
  state.profile.unit = to;
  const c = state.profile.cut;
  if (c.goal !== '') c.goal = cv(c.goal);
  if (c.height !== '') c.height = Math.round(Number(c.height) * (to === 'kg' ? 2.54 : 1 / 2.54) * 10) / 10;

    out.kcal = Math.round(Math.max(tdee - deficit, bmr) / 10) * 10;

}
function paceMessage() {
  const r = weeklyRate();
  if (r == null) return 'Log a few weigh-ins across a full week to see your pace.';
  const a = weightTrend(), now = a[a.length - 1].trend;
  const loss = -r, pct = (loss / now) * 100, target = PACES[state.profile.cut.pace][0] * 100, u = unitLabel();
  const amt = `${Math.abs(Math.round(loss * 10) / 10)} ${u} a week`;
  if (pct > 1) return `Trend is down about ${amt}, faster than 1% of body weight. That can cost muscle, so add some food.`;
  if (pct >= target * 0.5) return `On pace: trend is down about ${amt}.`;
  if (pct >= 0.1) return `A little slower than planned (${amt}). Give it another week before changing anything.`;
  return 'Weight is holding steady. If your lifts are climbing, that is a fine result. If not, trim a little food or add steps.';
}
function todayNut() { return state.nutrition[dateKey()] || { entries: [] }; }
function nutTotals() {
  const e = todayNut().entries;
  return { kcal: e.reduce((a, x) => a + (x.kcal || 0), 0), protein: e.reduce((a, x) => a + (x.p || 0), 0) };
}
function addNut(kcal, p) {
  const k = dateKey();
  (state.nutrition[k] = state.nutrition[k] || { entries: [] }).entries.push({ kcal, p });

function undoNut() { const n = state.nutrition[dateKey()]; if (n) n.entries.pop(); }
function muscleCheck() {
  const ids = [];
  for (const l of state.logs) for (const e of l.entries) if (!ids.includes(e.ex)) ids.push(e.ex);
  let tracked = 0;
  const slipping = [];
  for (const id of ids) {
    const vals = [];
    for (const l of state.logs) { const e = l.entries.find((x) => x.ex === id); if (e) { const v = sessionE1(e); if (v > 0) vals.push(v); } }
    if (vals.length < 4) continue;
    tracked++;

function lineChart(pts) {
  if (pts.length < 2) return '<p class="sub">Log this lift in two workouts to see a trend.</p>';

  const x = (i) => px + (i * (W - px - 10)) / (pts.length - 1);
  const y = (v) => H - py - ((v - lo) / (hi - lo)) * (H - py * 2);
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Estimated one-rep max over time">
    <line x1="${px}" y1="${y(lo)}" x2="${W - 6}" y2="${y(lo)}" stroke="#C8CDD3"/><line x1="${px}" y1="${y(hi)}" x2="${W - 6}" y2="${y(hi)}" stroke="#C8CDD3"/>
    <text x="2" y="${y(hi) + 4}" font-size="11" fill="#5B6573">${Math.round(hi)}</text><text x="2" y="${y(lo) + 4}" font-size="11" fill="#5B6573">${Math.round(lo)}</text>

function renderTimerBar() {
  const el = $('#timerbar');
  if (!timer) { el.className = 'timerbar'; el.innerHTML = ''; return; }
  el.className = 'timerbar on';
  el.innerHTML = `<div class="tbin"><span class="time" id="tleft">0:00</span><span class="bar"><i id="tfill" style="width:0;background:var(--accent)"></i></span>
    <button data-act="tadj" data-v="-15">-15s</button><button data-act="tadj" data-v="15">+15s</button><button data-act="tskip">Skip</button></div>`;
  tickTimer();
}
function tickTimer() {
  if (!timer) return;
  const left = Math.max(0, (timer.end - Date.now()) / 1000);
  const t = $('#tleft'), f = $('#tfill');
  if (t) t.textContent = left > 0 ? fmtClock(Math.ceil(left)) : 'Go!';
  if (f) f.style.width = clamp(100 - (left / timer.total) * 100, 0, 100) + '%';
  if (left <= 0 && !timer.doneAt) {
    timer.doneAt = Date.now();
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* ignore */ }
    beep();
  }
  if (timer.doneAt && Date.now() - timer.doneAt > 4000) { timer = null; renderTimerBar(); }
}
let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); o.stop(audioCtx.currentTime + 0.25);
  } catch (e) { /* ignore */ }
}
function startRest(sec) { timer = { end: Date.now() + sec * 1000, total: sec, doneAt: null }; renderTimerBar(); }

/* ================= events ================= */
let wake = null;
async function acquireWake() {
  try {
    if (navigator.wakeLock && !wake) {
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener('release', () => { wake = null; });
    }
  } catch (e) { /* ignore */ }
}
function releaseWake() { try { if (wake) wake.release(); } catch (e) { /* ignore */ } wake = null; }

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'plate-week-backup.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

const RIR_CYCLE = [null, 3, 2, 1, 0];

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'chartex') return;
  const a = state.active;
  const card = t.closest('[data-ei]');
  const ei = card ? +card.dataset.ei : null;
  const row = t.closest('.setrow');
  const si = row ? +row.dataset.si : null;
  const id = t.dataset.id, v = t.dataset.v;
  const shEi = ui.sheet && ui.sheet.ei != null ? ui.sheet.ei : null;
  const close = () => { ui.sheet = null; };

  switch (act) {
    case 'tab': ui.tab = v; ui.sheet = null; ui.confirm = null; commit(); render({ top: true }); break;
    case 'gym': state.profile.gym = id; commit(); render(); break;
    case 'dur': state.profile.duration = +v; commit(); render(); break;
    case 'focus': {
      const m = t.dataset.m;
      ui.focus = ui.focus.includes(m) ? ui.focus.filter((x) => x !== m) : ui.focus.concat(m);
      render(); break;
    }
    case 'generate': {
      const w = generate();
      if (!w) { toast('No exercises fit this gym profile and focus.'); break; }
      state.active = w; ui.cue = {}; ui.focus = [];
      acquireWake(); commit(); render({ top: true }); break;
    }
    case 'empty':
      state.active = { id: uid(), created: Date.now(), startedAt: null, gym: state.profile.gym, label: 'Custom workout', kind: null, why: '', entries: [] };
      ui.cue = {}; ui.addMuscle = 'all'; ui.addQuery = ''; ui.sheet = { type: 'add' };
      acquireWake(); commit(); render({ top: true }); break;

    case 'toggle': {
      const en = a.entries[ei], s = en.sets[si];
      if (!s.done) {
        if (!Number(s.r)) s.r = en.reps;
        s.done = true;
        if (!a.startedAt) a.startedAt = Date.now();
        startRest(s.warm ? 30 : en.rest);
      } else s.done = false;
      commit(); render(); break;
    }
    case 'rir': {
      const s = a.entries[ei].sets[si];
      s.rir = RIR_CYCLE[(RIR_CYCLE.indexOf(s.rir) + 1) % RIR_CYCLE.length];
      t.textContent = s.rir == null ? '–' : s.rir;
      commit(); break;
    }
    case 'addset': {
      const en = a.entries[ei];
      const work = en.sets.filter((s) => !s.warm);
      const last = work[work.length - 1];
      en.sets.push({ w: last ? last.w : '', r: '', rir: null, done: false, warm: false });
      commit(); render(); break;
    }
    case 'addwarm':
      if (!addWarmups(a.entries[ei])) toast('Add a working weight first.');
      commit(); render(); break;
    case 'cue': ui.cue[ei] = !ui.cue[ei]; render(); break;
    case 'exmenu': ui.sheet = { type: 'exmenu', ei }; render(); break;
    case 'wmenu': ui.sheet = { type: 'wmenu' }; render(); break;
    case 'addex': ui.addMuscle = 'all'; ui.addQuery = ''; ui.sheet = { type: 'add' }; render(); break;
    case 'swapopen': ui.sheet = { type: 'swap', ei: shEi }; render(); break;
    case 'doswap': {
      const old = a.entries[shEi].ex;
      state.prefs[old] = clamp((state.prefs[old] || 0) - 10, -100, 100);
      a.entries[shEi] = makeEntry(EXI[id], shEi === 0);
      close(); commit(); render(); break;
    }
    case 'more': case 'less': {
      const exId = a.entries[shEi].ex;
      state.prefs[exId] = clamp((state.prefs[exId] || 0) + (act === 'more' ? 30 : -30), -100, 100);
      toast(act === 'more' ? 'You will see this exercise more often.' : 'You will see this exercise less often.');
      close(); commit(); render(); break;
    }
    case 'exclude':
      state.excl[a.entries[shEi].ex] = true;
      toast('Hidden from future workouts. Bring it back in My plan.');
      close(); commit(); render(); break;
    case 'rmset': a.entries[shEi].sets.pop(); close(); commit(); render(); break;
    case 'rmex': a.entries.splice(shEi, 1); close(); commit(); render(); break;
    case 'doadd':
      a.entries.push(makeEntry(EXI[id], a.entries.length === 0));
      close(); toast(`${EXI[id].name} added`); commit(); render(); break;
    case 'addm': ui.addMuscle = t.dataset.m; renderSheet(); break;

    case 'muscle': ui.sheet = { type: 'muscle', m: t.dataset.m }; render(); break;
    case 'savemuscle':
      setRecovery(ui.sheet.m, +$('#rslide').value);
      close(); commit(); render(); break;

    case 'finish': ui.sheet = { type: 'confirmfinish' }; render(); break;
    case 'confirmfinish': {
      const res = finishWorkout();
      if (!res) { toast('Mark at least one set done first.'); close(); } else { ui.sheet = { type: 'summary', res }; timer = null; releaseWake(); }
      commit(); render({ top: true }); break;
    }
    case 'summarydone': close(); render({ top: true }); break;
    case 'discard': ui.sheet = { type: 'confirmdiscard' }; render(); break;
    case 'confirmdiscard': state.active = null; timer = null; releaseWake(); close(); commit(); render({ top: true }); break;
    case 'regen': {
      const w = generate();
      if (w) { state.active = w; ui.cue = {}; } else toast('No exercises fit this gym profile.');
      close(); commit(); render({ top: true }); break;
    }
    case 'closesheet': close(); render(); break;

    case 'openlog':
      ui.tab = 'progress'; ui.openLog = id; render({ top: true });
      setTimeout(() => { const el = document.getElementById('log-' + id); if (el && el.scrollIntoView) el.scrollIntoView(); }, 0);
      break;
    case 'togglelog': ui.openLog = ui.openLog === id ? null : id; ui.confirm = null; render(); break;
    case 'dellog':
      if (ui.confirm === id) { state.logs = state.logs.filter((l) => l.id !== id); ui.confirm = null; ui.openLog = null; commit(); } else ui.confirm = id;
      render(); break;

    case 'set': {
      const k = t.dataset.k;
      state.profile[k] = ['duration', 'perWeek'].includes(k) ? +v : v;
      commit(); render(); break;
    }
    case 'unit': convertUnit(v); commit(); render(); break;
    case 'gymedit': ui.sheet = { type: 'gym', id }; render(); break;
    case 'gymadd': {
      const eq = {};
      EQUIP.forEach(([k]) => (eq[k] = false));
      const g = { id: uid(), name: 'Gym ' + (state.gyms.length + 1), eq };
      state.gyms.push(g);
      ui.sheet = { type: 'gym', id: g.id }; commit(); render(); break;
    }
    case 'gymtoggle': {
      const g = gymById(ui.sheet.id);
      g.eq[t.dataset.k] = !g.eq[t.dataset.k];
      commit(); renderSheet(); break;
    }
    case 'gymdelete':
      state.gyms = state.gyms.filter((g) => g.id !== ui.sheet.id);
      if (!state.gyms.some((g) => g.id === state.profile.gym)) state.profile.gym = state.gyms[0].id;
      close(); commit(); render(); break;
    case 'restore': delete state.excl[id]; commit(); render(); break;
    case 'resetprefs': state.prefs = {}; commit(); render(); break;

    case 'export': exportData(); break;
    case 'copybackup':
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(JSON.stringify(state)).then(() => toast('Backup copied'), () => toast('Copy failed. Use the export file instead.'));
      else toast('Copy is not available here. Use the export file instead.');
      break;
    case 'import': { const f = $('#impfile'); if (f) f.click(); break; }
    case 'resetall':
      if (ui.confirm === 'reset') { state = defaultState(); ui.confirm = null; timer = null; releaseWake(); commit(); toast('All data erased'); } else ui.confirm = 'reset';
      render(); break;

    case 'cuton': state.profile.cut.on = !state.profile.cut.on; commit(); render(); break;
    case 'cutset': {
      const k = t.dataset.k;
      state.profile.cut[k] = ['activity', 'min'].includes(k) ? +v : v;
      commit(); render(); break;
    }
    case 'logweight': {
      const n = parseFloat(($('#wi').value || '').replace(/[^0-9.]/g, ''));
      const kg = toKgW(n);
      if (!(n > 0) || kg < 25 || kg > 320) { toast('Enter your weight in ' + unitLabel() + '.'); break; }
      logWeight(n); toast('Weigh-in saved'); commit(); render(); break;
    }
    case 'addnut': {
      const k = parseInt(($('#nk').value || '').replace(/\D/g, ''), 10) || 0;
      const pr = parseInt(($('#np').value || '').replace(/\D/g, ''), 10) || 0;
      if (!k && !pr) { toast('Enter calories, protein, or both.'); break; }
      addNut(k, pr); commit(); render(); break;
    }
    case 'undonut': undoNut(); commit(); render(); break;
    case 'fin': a.finisher.done = !a.finisher.done; commit(); render(); break;
    case 'tadj':
      if (timer) { timer.end += +v * 1000; if (+v > 0) timer.total += +v; timer.doneAt = null; tickTimer(); }
      break;
    case 'tskip': timer = null; renderTimerBar(); break;
  }
});

document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'addq') { ui.addQuery = el.value; const l = $('#addlist'); if (l) l.innerHTML = addList(); return; }
  if (el.id === 'rslide') { const rv = $('#rv'); if (rv) rv.textContent = el.value; return; }
  const f = el.dataset && el.dataset.f;
  if (!f) return;
  if (f === 'gymname') { gymById(ui.sheet.id).name = el.value || 'Gym'; commit(); return; }
  if (f === 'cutgoal' || f === 'cutheight' || f === 'cutage') {
    const n = parseFloat(el.value.replace(/[^0-9.]/g, ''));
    const key = { cutgoal: 'goal', cutheight: 'height', cutage: 'age' }[f];
    state.profile.cut[key] = n > 0 ? n : '';
    const box = $('#cuttargets'); if (box) box.innerHTML = cutTargetsHTML();
    commit(); return;
  }
  if (f === 'bw') {
    const n = parseFloat(el.value.replace(/[^0-9.]/g, ''));
    if (n > 0) { state.profile.bw = n; commit(); }
    return;
  }
  const row = el.closest('.setrow');
  if (!row || !state.active) return;
  const s = state.active.entries[+row.dataset.ei].sets[+row.dataset.si];
  if (f === 'w') {
    const n = parseFloat(el.value.replace(/[^0-9.]/g, ''));
    s.w = isNaN(n) ? '' : n;
  } else if (f === 'r') {
    const n = parseInt(el.value.replace(/\D/g, ''), 10);
    s.r = isNaN(n) ? '' : n;
  }
  commit();
});

document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.act === 'chartex') { ui.chartEx = el.value; render(); return; }
  if (el.id === 'impfile' && el.files && el.files[0]) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const obj = JSON.parse(rd.result);
        if (!obj || !Array.isArray(obj.logs)) throw new Error('bad');
        state = normalize(obj); commit(); toast('Backup restored'); render({ top: true });
      } catch (e) { toast('That file is not a Plate Week backup.'); }
    };
    rd.readAsText(el.files[0]);
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.active) acquireWake();
  if (document.visibilityState === 'hidden') flush();
});
window.addEventListener('pagehide', flush);

/* ================= boot ================= */
(async function init() {
  state = normalize(await Store.load());
  pruneRecovery();
  if (state.active) { ui.tab = 'workout'; acquireWake(); }
  render();
  setInterval(() => {
    tickTimer();
    const el = $('#elapsed');
    if (el && state.active && state.active.startedAt) el.textContent = fmtClock((Date.now() - state.active.startedAt) / 1000);
  }, 500);
})();
</script>
</body>
</html>
